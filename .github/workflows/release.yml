name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit tests/run.lua
      # Builds DropOff-<tag>.zip and attaches it to a GitHub release.
      # Uploads to CurseForge too once CF_API_TOKEN is set and the TOC carries
      # "## X-Curse-Project-ID".
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
